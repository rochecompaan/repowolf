syntax = "proto3";

package repowolf.v1;

option go_package = "github.com/rochecompaan/repowolf/gen/repowolf/v1;repowolfv1";

import "google/protobuf/timestamp.proto";
import "repowolf/v1/common.proto";
import "repowolf/v1/meta.proto";

service GiteaService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Execute(GiteaRequest) returns (GiteaResponse);
}

message GiteaRepositoryViewRequest {}

enum GiteaIssueState {
  GITEA_ISSUE_STATE_UNSPECIFIED = 0;
  GITEA_ISSUE_STATE_OPEN = 1;
  GITEA_ISSUE_STATE_CLOSED = 2;
  GITEA_ISSUE_STATE_ALL = 3;
}

enum GiteaIssueKind {
  GITEA_ISSUE_KIND_UNSPECIFIED = 0;
  GITEA_ISSUE_KIND_ISSUE = 1;
}

enum GiteaIssueField {
  GITEA_ISSUE_FIELD_UNSPECIFIED = 0;
  GITEA_ISSUE_FIELD_INDEX = 1;
  GITEA_ISSUE_FIELD_STATE = 2;
  GITEA_ISSUE_FIELD_AUTHOR = 3;
  GITEA_ISSUE_FIELD_AUTHOR_ID = 4;
  GITEA_ISSUE_FIELD_URL = 5;
  GITEA_ISSUE_FIELD_TITLE = 6;
  GITEA_ISSUE_FIELD_BODY = 7;
  GITEA_ISSUE_FIELD_CREATED = 8;
  GITEA_ISSUE_FIELD_UPDATED = 9;
  GITEA_ISSUE_FIELD_DEADLINE = 10;
  GITEA_ISSUE_FIELD_ASSIGNEES = 11;
  GITEA_ISSUE_FIELD_MILESTONE = 12;
  GITEA_ISSUE_FIELD_LABELS = 13;
  GITEA_ISSUE_FIELD_COMMENTS = 14;
  GITEA_ISSUE_FIELD_REPO = 15;
  GITEA_ISSUE_FIELD_OWNER = 16;
  GITEA_ISSUE_FIELD_KIND = 17;
}

message GiteaIssueListRequest {
  GiteaIssueState state = 1;
  optional string keyword = 2;
  optional string author = 3;
  optional string assignee = 4;
  optional string mentions = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp until = 7;
  optional string owner = 8;
  int32 page = 9;
  int32 limit = 10;
  repeated GiteaIssueField fields = 11;
}

message GiteaIssueViewRequest {
  int64 index = 1;
  bool include_comments = 2;
}

message GiteaIssueCreateRequest {
  string title = 1;
  optional string description = 2;
  repeated string assignees = 3;
  repeated string labels = 4;
}
message GiteaIssueCommentRequest { int64 index = 1; string body = 2; }
message GiteaIssueCloseRequest { int64 index = 1; }
message GiteaIssueReopenRequest { int64 index = 1; }

message GiteaStringList { repeated string values = 1; }
message GiteaIssueEditRequest {
  int64 index = 1;
  optional string title = 2;
  optional string description = 3;
  oneof assignee_action {
    GiteaStringList set_assignees = 4;
    GiteaStringList add_assignees = 5;
    GiteaStringList remove_assignees = 6;
  }
  oneof label_action {
    GiteaStringList add_labels = 7;
    GiteaStringList remove_labels = 8;
  }
}

message GiteaRequest {
  RequestContext context = 1;
  oneof operation {
    GiteaRepositoryViewRequest repository_view = 10;
    GiteaIssueListRequest issue_list = 11;
    GiteaIssueViewRequest issue_view = 12;
    GiteaIssueCreateRequest issue_create = 13;
    GiteaIssueCommentRequest issue_comment = 14;
    GiteaIssueCloseRequest issue_close = 15;
    GiteaIssueReopenRequest issue_reopen = 16;
    GiteaIssueEditRequest issue_edit = 17;
  }
}

message GiteaRepositoryRecord {
  string full_name = 1;
  string description = 2;
  string default_branch = 3;
  string url = 4;
  string ssh_url = 5;
  string clone_url = 6;
  bool private = 7;
  bool archived = 8;
  bool fork = 9;
  bool mirror = 10;
  bool empty = 11;
  uint64 stars = 12;
  uint64 forks = 13;
  uint64 open_issues = 14;
  uint64 size = 15;
  repeated string topics = 16;
  google.protobuf.Timestamp created = 17;
  google.protobuf.Timestamp updated = 18;
}

message GiteaRepositoryViewResult { GiteaRepositoryRecord repository = 1; }

message GiteaCommentRecord {
  int64 id = 1;
  int64 author_id = 2;
  string author = 3;
  string url = 4;
  string body = 5;
  google.protobuf.Timestamp created = 6;
  google.protobuf.Timestamp updated = 7;
}

message GiteaIssueRecord {
  int64 index = 1;
  GiteaIssueState state = 2;
  GiteaIssueKind kind = 3;
  int64 author_id = 4;
  string author = 5;
  string url = 6;
  string title = 7;
  string body = 8;
  string repo = 9;
  string owner = 10;
  google.protobuf.Timestamp created = 11;
  google.protobuf.Timestamp updated = 12;
  google.protobuf.Timestamp deadline = 13;
  repeated string assignees = 14;
  optional string milestone = 15;
  repeated string labels = 16;
  int64 comment_count = 17;
  repeated GiteaCommentRecord comments = 18;
}

message GiteaIssueListResult { repeated GiteaIssueRecord issues = 1; }
message GiteaIssueViewResult { GiteaIssueRecord issue = 1; }
message GiteaIssueCreateResult { GiteaIssueRecord issue = 1; }
message GiteaIssueCommentResult { GiteaCommentRecord comment = 1; }
message GiteaIssueCloseResult { GiteaIssueRecord issue = 1; }
message GiteaIssueReopenResult { GiteaIssueRecord issue = 1; }
message GiteaIssueEditResult { GiteaIssueRecord issue = 1; }

message GiteaResponse {
  ResponseMeta meta = 1;
  oneof result {
    GiteaRepositoryViewResult repository_view = 10;
    GiteaIssueListResult issue_list = 11;
    GiteaIssueViewResult issue_view = 12;
    GiteaIssueCreateResult issue_create = 13;
    GiteaIssueCommentResult issue_comment = 14;
    GiteaIssueCloseResult issue_close = 15;
    GiteaIssueReopenResult issue_reopen = 16;
    GiteaIssueEditResult issue_edit = 17;
  }
}
