version: 2
project_name: repowolf

builds:
  - id: repowolf
    main: ./cmd/repowolf
    binary: repowolf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rochecompaan/repowolf/internal/buildinfo.Version={{ .Version }}
  - id: repowolf-client
    main: ./cmd/repowolf-client
    binary: repowolf-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rochecompaan/repowolf/internal/buildinfo.Version={{ .Version }}

archives:
  - ids:
      - repowolf
      - repowolf-client
    formats:
      - tar.gz
    name_template: "repowolf_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true
