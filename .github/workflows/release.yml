name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      - name: Confirm native architecture
        run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Build and smoke-test release archives
        run: scripts/check-release.sh
      - name: Build and smoke-test OCI image
        run: scripts/ci/oci/smoke-image.sh "${{ matrix.arch }}"

  publish-archives:
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      - name: Publish binary archives and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c goreleaser release --clean

  publish-image:
    needs: release-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      - name: Build and smoke-test OCI image
        run: scripts/ci/oci/smoke-image.sh "${{ matrix.arch }}"
      - name: Publish architecture image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="$(nix build .#ociImage --no-link --print-out-paths)"
          target="ghcr.io/rochecompaan/repowolf:$GITHUB_REF_NAME-${{ matrix.arch }}"
          printf '%s' "$GHCR_TOKEN" \
            | nix develop -c skopeo login \
                --username "$GITHUB_ACTOR" \
                --password-stdin ghcr.io
          nix develop -c skopeo copy \
            docker-archive:"$image" \
            docker://"$target"

  publish-image-manifest:
    needs: publish-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
      - name: Publish and validate multi-architecture manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/rochecompaan/repowolf"
          tag="$GITHUB_REF_NAME"
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io \
                --username "$GITHUB_ACTOR" \
                --password-stdin
          docker buildx imagetools create \
            --tag "$image:$tag" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
          docker buildx imagetools inspect --raw "$image:$tag" \
            | nix develop -c scripts/ci/oci/check-manifest-platforms.sh
