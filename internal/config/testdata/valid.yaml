apiVersion: repowolf.dev/v1alpha1
listen: :8443
tls:
  certificate: /run/repowolf/tls.crt
  privateKey: /run/repowolf/tls.key
tools:
  gh: null
  ssh: null
providers:
  github:
    kind: github
    apiHost: github.com
    gitHost: github.com
    sshUser: git
    tokenEnv: REPOWOLF_TOKEN_GITHUB
repositories:
  sample-project:
    provider: github
    owner: alpha
    name: sample-project
    git:
      denyDeletes: true
      maxRefUpdates: 16
principals:
  agent:
    tokenEnvs:
      - REPOWOLF_TOKEN_AGENT
    grants:
      - repository: sample-project
        capabilities:
          - repository:read
          - git:read
          - git:write
